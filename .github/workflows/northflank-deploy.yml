name: Deploy to Northflank

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-combined-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create Northflank project and combined service
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          NORTHFLANK_PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
          NORTHFLANK_DEPLOYMENT_PLAN: ${{ vars.NORTHFLANK_DEPLOYMENT_PLAN }}
        run: python deploy/northflank_deploy.py
