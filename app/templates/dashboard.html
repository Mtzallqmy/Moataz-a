<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ app_name }} — Dashboard</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <div class="orb orb-a"></div><div class="orb orb-b"></div>
  <main class="shell">
    <header class="topbar glass">
      <div>
        <p class="eyebrow">PRIVATE MEDIA WORKSPACE</p>
        <h1>{{ app_name }}</h1>
      </div>
      <div class="live"><span></span> LIVE</div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="grid">
      <article class="glass panel jobs-panel">
        <div class="panel-head"><h2>المهام / Jobs</h2><span id="updated">—</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>العنوان</th><th>المصدر</th><th>الجودة</th><th>الحالة</th><th>التقدم</th></tr></thead>
            <tbody id="jobs"></tbody>
          </table>
        </div>
      </article>

      <article class="glass panel users-panel">
        <div class="panel-head"><h2>العُقد / Workers</h2></div>
        <div id="workers" class="users-list workers-list"></div>
        <div class="panel-head secondary"><h2>المستخدمون / Users</h2></div>
        <form action="/dashboard/users" method="post" class="user-form">
          <input name="telegram_id" type="number" placeholder="Telegram ID" required>
          <select name="language"><option value="ar">العربية</option><option value="en">English</option></select>
          <label class="check"><input name="allowed" type="checkbox" value="true" checked> مسموح</label>
          <button type="submit">حفظ</button>
        </form>
        <div id="users" class="users-list"></div>
      </article>
    </section>
  </main>
<script>
const token = {{ ws_token|tojson }};
const stats = document.querySelector('#stats');
const jobs = document.querySelector('#jobs');
const users = document.querySelector('#users');
const workers = document.querySelector('#workers');

function esc(v){return String(v ?? '—').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(data){
  stats.innerHTML = `
    <div class="glass stat"><b>${data.stats.active_jobs}</b><span>Active Jobs</span></div>
    <div class="glass stat"><b>${data.stats.total_jobs}</b><span>Total Jobs</span></div>
    <div class="glass stat"><b>${data.stats.users}</b><span>Users</span></div>`;
  jobs.innerHTML = data.jobs.map(j=>`<tr>
    <td>${j.id}</td><td title="${esc(j.error||'')}">${esc(j.title)}</td><td>${esc(j.platform)}</td>
    <td>${esc(j.quality)}</td><td><span class="status ${j.status.toLowerCase()}">${esc(j.status)}</span></td>
    <td><div class="progress"><i style="width:${Number(j.progress)}%"></i></div><small>${j.progress}%</small></td>
  </tr>`).join('');
  users.innerHTML = data.users.map(u=>`<div class="user-row"><div><b>${esc(u.username)}</b><small>${u.telegram_id}</small></div><span>${u.allowed?'✅':'⛔'} ${esc(u.language)}</span></div>`).join('');
  workers.innerHTML = (data.workers||[]).map(w=>`<div class="user-row"><div><b>${esc(w.id)}</b><small>${esc(w.hostname)}</small></div><span>${w.status==='ONLINE'?'🟢':'⚪'} ${w.active_jobs} jobs</span></div>`).join('') || '<small>لا توجد Workers متصلة</small>';
  document.querySelector('#updated').textContent = new Date().toLocaleTimeString();
}

function connect(){
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${scheme}://${location.host}/ws/jobs?token=${encodeURIComponent(token)}`);
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
