services:
  api:
    build: .
    env_file: .env
    restart: unless-stopped
    command: python -m app.main
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - media_data:/data/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${APP_PORT:-8000}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    env_file: .env
    restart: unless-stopped
    command: arq app.worker.WorkerSettings
    volumes:
      - media_data:/data/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moataz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moataz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
  media_data:
