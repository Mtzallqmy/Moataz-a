services:
  app:
    build: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql://postgres@db:5432/moataz
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - downloads:/data/downloads
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: moataz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moataz"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  downloads:
